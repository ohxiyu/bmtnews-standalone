# Cloudflare's Git integration runs `bundle exec jekyll build` at the
# repository root for pull-request previews. Production publishing still
# copies docs/ to gh-pages, where docs/_config.yml becomes the root config.
source: docs
destination: _site

title: BMTNews
description: Crypto market intelligence covering exchanges, markets, security, regulation, and protocols
baseurl: ""
url: "https://bmt.news"
asset_version: "sha256-801ef6bfd65b"

markdown: kramdown
future: true
include:
  - "_headers"
  - "_worker.js"
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
