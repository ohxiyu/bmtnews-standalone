<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#171714" />
    <link rel="icon" href="/assets/images/app-icon.svg" />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <title>BMTNews 发布台</title>
    <style>
      html,
      body,
      #nc-root {
        min-height: 100%;
        margin: 0;
      }

      .admin-boot {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px;
        background: #f7f6f2;
        color: #171714;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .admin-boot-card {
        width: min(100%, 420px);
        padding: 30px;
        border: 1px solid #d8d6cf;
        background: #fff;
      }

      .admin-boot-brand {
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.14em;
      }

      .admin-boot h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.2;
      }

      .admin-boot p {
        margin: 12px 0 0;
        color: #696862;
        font-size: 14px;
        line-height: 1.7;
      }

      .admin-boot:has(~ *) {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="nc-root">
      <main class="admin-boot" aria-live="polite">
        <section class="admin-boot-card">
          <p class="admin-boot-brand">BMTNEWS EDITORIAL</p>
          <h1>内容发布台</h1>
          <p>正在连接发布系统。加载完成后可发布编辑精选、安排广告或隐藏已有报道。</p>
        </section>
      </main>
    </div>
    <!--
      Sveltia CMS: a single static script; content edits are Git commits to
      data/editorial.json on main, which triggers the editorial-rebuild
      workflow. No server, no database. Sign in with a fine-grained GitHub
      personal access token (repo: bmtnews-standalone, Contents: Read and write) —
      see project-docs/editorial.md for setup.
    -->
    <!-- Version pinned deliberately: bump manually after reviewing releases. -->
    <script src="https://unpkg.com/@sveltia/cms@0.176.0/dist/sveltia-cms.js"
      integrity="sha384-fdfr1N0RHfH/PQqUh8GT8MBIu9RdbSaMFGUbJ//47IKHK9p+LobwHwpCx+BcFcA6"
      crossorigin="anonymous"></script>
  </body>
</html>
