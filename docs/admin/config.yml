backend:
  name: github
  repo: ohxiyu/bmtnews-standalone
  branch: main
  automatic_deployments: true
  # One-click GitHub sign-in (optional). To enable:
  #   1. Create a GitHub OAuth App (callback URL:
  #      https://<worker-host>/oauth/callback)
  #   2. wrangler secret put GITHUB_OAUTH_CLIENT_ID / GITHUB_OAUTH_CLIENT_SECRET
  #      in ops/daily-dispatcher, then redeploy the worker
  #   3. Uncomment and fill in the worker host below.
  # Until then the sign-in screen offers personal-access-token login.
  # base_url: https://<worker-host>
  # auth_endpoint: /oauth/auth

site_url: https://bmt.news
display_url: https://bmt.news
media_folder: docs/assets/uploads
public_folder: /assets/uploads

collections:
  - name: editorial
    label: 日报编辑
    icon: edit_note
    files:
      - name: editorial_items
        label: 插入条目（编辑精选 / 广告 / 压稿）
        file: data/editorial.json
        format: json
        fields:
          - name: _readme
            widget: hidden
            required: false

          - name: items
            label: 条目列表
            label_singular: 条目
            widget: list
            collapsed: true
            summary: "{{fields.type}} ｜ {{fields.title_zh}} {{fields.url}}"
            hint: >-
              保存后会自动 commit 到 main 并触发重刊，约 5 分钟后 bmt.news
              更新。不再需要的条目请把「启用」关掉或直接删除。
            fields:
              - name: type
                label: 类型
                widget: select
                options:
                  - { label: "编辑精选 — 自己插入一条新闻（置顶展示）", value: editorial }
                  - { label: "广告 — 带广告标签的推广位（仅网页）", value: sponsored }
                  - { label: "压稿 — 按 URL 隐藏一条新闻", value: suppress }
                default: editorial

              - name: enabled
                label: 启用
                widget: boolean
                default: true
                hint: 关掉即整条失效，适合先写好草稿再上线。

              - name: url
                label: 链接 URL
                widget: string
                pattern:
                  - "^https?://.+"
                  - "必须是以 http:// 或 https:// 开头的完整链接"
                hint: 编辑精选/广告的跳转链接；压稿时填要隐藏的新闻链接。

              - name: title_zh
                label: 中文标题
                widget: string
                required: false
                hint: 编辑精选和广告必填（压稿可留空）。

              - name: title_en
                label: 英文标题
                widget: string
                required: false
                hint: 留空时英文版会直接使用中文标题。

              - name: summary_zh
                label: 中文摘要
                widget: text
                required: false
                hint: 一两句话；会显示在标题下方。

              - name: summary_en
                label: 英文摘要
                widget: text
                required: false

              - name: date
                label: 生效日期（单日）
                widget: datetime
                format: YYYY-MM-DD
                date_format: YYYY-MM-DD
                time_format: false
                required: false
                default: ""
                hint: >-
                  只在这一天的刊期生效（东八区刊期日）。编辑精选和压稿一般填今天。
                  留空 = 每期都生效，慎用。

              - name: starts
                label: 开始日期（区间）
                widget: datetime
                format: YYYY-MM-DD
                date_format: YYYY-MM-DD
                time_format: false
                required: false
                default: ""
                hint: 广告用：从这天开始自动上刊。

              - name: expires
                label: 结束日期（区间）
                widget: datetime
                format: YYYY-MM-DD
                date_format: YYYY-MM-DD
                time_format: false
                required: false
                default: ""
                hint: 广告用：过了这天自动下刊。

              - name: position
                label: 广告插入位置
                widget: number
                value_type: int
                min: 1
                max: 20
                required: false
                hint: 仅广告有效：插在第几条新闻的位置，默认 4（第三条之后）。

              - name: label
                label: 来源署名
                widget: string
                required: false
                hint: 编辑精选的来源显示名，默认 Editorial。
