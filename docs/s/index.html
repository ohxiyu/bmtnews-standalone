<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>BMTNews · 发布台</title>
<link rel="icon" href="/assets/images/bmtnews-favicon-v1.svg">
<link rel="stylesheet" href="/s/admin.css"></head>
<body><main>
<header><a href="/">BMTNews <small>bmt.news</small></a><nav><a href="/s/sources/">信息源</a><a href="/cdn-cgi/access/logout">退出</a></nav></header>
<section aria-labelledby="heading"><p class="eyebrow">EDITORIAL DESK</p><h1 id="heading">Quick Post</h1>
<p class="muted">只写正文即可。保存后自动发布，不调用 AI；通常需要等待数分钟。</p>
<form id="post-form">
<label for="body">正文</label><textarea id="body" maxlength="10000" rows="9" placeholder="发生了什么？写清主体、时间与关键事实。支持分段。" required disabled></textarea>
<div class="row"><label for="url">原文链接（选填）<input id="url" type="url" maxlength="2048" placeholder="https://"></label>
<label for="date">刊期日期（上海时间）<input id="date" type="date" required></label></div>
<div class="row"><label for="category">分类（选填）<select id="category"><option value="">不分类</option>
<option value="crypto-markets">加密市场</option><option value="crypto-exchange">交易所</option>
<option value="crypto-protocol">协议与链上</option><option value="crypto-security">安全事件</option>
<option value="policy-regulation">加密监管</option><option value="ai-technology">AI 与科技</option>
<option value="macro-policy">宏观政策</option></select></label>
<label for="image">配图（选填，最大 1 MB）<input id="image" type="file" accept="image/png,image/jpeg,image/webp"></label></div>
<div id="image-state" class="muted"></div><button type="button" id="remove-image" hidden>移除配图</button>
<div class="row checks"><label><input id="breaking" type="checkbox"> Breaking</label><label><input id="pin" type="checkbox"> 刊期内置顶</label></div>
<div class="actions"><button type="submit" id="publish" disabled>发布</button><button type="button" id="save-draft" disabled>保存草稿</button><button type="button" id="new-post">新建</button></div>
<p id="status" role="status" aria-live="polite">正在加载…</p>
</form></section>
<section><div class="row"><h2>内容与草稿</h2><button id="refresh" type="button">刷新列表</button></div>
<p class="muted">旧编辑精选、广告和压稿记录保留。可启用或停用；Quick Post 可继续编辑。已上线状态以公开接口中的实际内容为准。</p>
<div id="entries"></div></section>
<details id="legacy-panel"><summary>旧编辑精选、广告与压稿管理</summary>
<p class="muted">旧内容继续使用原有重刊流程；这类修改可能触发 AI 重建和通知。</p>
<form id="legacy-form"><div id="legacy-fields"></div>
<button type="submit">保存旧编辑记录</button><button type="button" id="legacy-new">新建记录</button></form>
</details>
<noscript>发布台需要启用 JavaScript。</noscript>
</main><script src="/s/admin.js" defer></script></body></html>
