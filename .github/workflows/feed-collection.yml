name: BMTNews Feed Collection

on:
  schedule:
    # Coverage runs roughly every four hours; the final fetch happens in
    # daily-summary.yml at the 08:30 cutoff. High-churn sources (exchange
    # Telegram channels) overflow their fetch limits with fewer runs.
    - cron: '30 0,4,12,16,20 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

concurrency:
  group: bmtnews-feed-update
  cancel-in-progress: false

permissions:
  contents: write  # Persists the staging cache to the staging-cache branch

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore staged source items
        uses: actions/cache@v5
        with:
          path: data/staging-items.json
          key: ${{ runner.os }}-bmtnews-staging-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-bmtnews-staging-v1-

      - name: Restore staging from persistent branch on cache miss
        shell: bash
        run: |
          if [ -f data/staging-items.json ]; then
            exit 0
          fi
          if git fetch --depth=1 origin staging-cache 2>/dev/null; then
            mkdir -p data
            git show FETCH_HEAD:data/staging-items.json > data/staging-items.json 2>/dev/null || rm -f data/staging-items.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - name: Install dependencies
        run: uv sync --frozen --extra trafilatura

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Collect source items without AI analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run bmtnews --mode fetch --hours 12

      - name: Publish run report
        if: ${{ always() }}
        run: python -m src.run_report --input data/run-report.json --output "$GITHUB_STEP_SUMMARY"

      - name: Persist staging cache to branch
        if: ${{ always() }}
        shell: bash
        run: |
          if [ ! -f data/staging-items.json ]; then
            echo "No staging file to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B staging-cache
          git add -f data/staging-items.json
          if git commit -m "chore: update staging cache"; then
            git push -f origin staging-cache
          else
            echo "Staging cache unchanged"
          fi
