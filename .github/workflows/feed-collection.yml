name: BMTNews Feed Collection

on:
  schedule:
    # Coverage runs roughly every four hours; the final fetch happens in
    # daily-summary.yml at the 08:30 cutoff. High-churn sources (exchange
    # Telegram channels) overflow their fetch limits with fewer runs.
    - cron: '30 0,4,12,16,20 * * *'
      timezone: 'Asia/Shanghai'
    # Independent post-cutoff path. Its recovery job dispatches the daily
    # edition even when Cloudflare and the standalone watchdog miss a trigger.
    - cron: '37 8 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

concurrency:
  group: bmtnews-feed-update
  cancel-in-progress: false

permissions:
  actions: write  # Allows the post-collection recovery check to dispatch daily
  contents: write  # Persists the staging cache to the staging-cache branch

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore published event state
        shell: bash
        run: |
          git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
          mkdir -p docs/_data
          for path in _data/events.json _data/event-legacy-urls.json; do
            git show "origin/gh-pages:${path}" > "docs/${path}"
          done
          if git cat-file -e "origin/gh-pages:_data/bmtnews_state.json" 2>/dev/null; then
            git show "origin/gh-pages:_data/bmtnews_state.json" > docs/_data/bmtnews_state.json
          fi
          mkdir -p docs/_data/archive
          for path in $(git ls-tree -r --name-only origin/gh-pages -- _data/archive 2>/dev/null); do
            git show "origin/gh-pages:${path}" > "docs/${path}"
          done

      - name: Restore staged source items
        uses: actions/cache@v5
        with:
          path: |
            data/staging-items.json
            data/analysis-cache.json
          key: ${{ runner.os }}-bmtnews-pipeline-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-bmtnews-pipeline-v2-
            ${{ runner.os }}-bmtnews-staging-v1-

      - name: Restore staging from persistent branch on cache miss
        shell: bash
        run: |
          if git fetch --depth=1 origin staging-cache 2>/dev/null; then
            mkdir -p data
            if [ ! -f data/staging-items.json ]; then
              git show FETCH_HEAD:data/staging-items.json > data/staging-items.json 2>/dev/null || rm -f data/staging-items.json
            fi
            if [ ! -f data/analysis-cache.json ]; then
              git show FETCH_HEAD:data/analysis-cache.json > data/analysis-cache.json 2>/dev/null || rm -f data/analysis-cache.json
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - name: Install dependencies
        run: uv sync --frozen --extra trafilatura

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Backfill event brief data
        run: uv run python -m src.event_brief_backfill

      - name: Collect sources and increment event timelines
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run bmtnews --mode fetch --hours 12

      - name: Publish run report
        if: ${{ always() }}
        run: python -m src.run_report --input data/run-report.json --output "$GITHUB_STEP_SUMMARY"

      - name: Deploy incremental event pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "🧭 Event timeline: ${{ github.run_id }}"
          publish_branch: gh-pages
          enable_jekyll: true

      - name: Persist staging cache to branch
        if: ${{ always() }}
        shell: bash
        run: |
          if [ ! -f data/staging-items.json ]; then
            echo "No staging file to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B staging-cache
          git add -f data/staging-items.json
          if [ -f data/analysis-cache.json ]; then
            git add -f data/analysis-cache.json
          fi
          if git commit -m "chore: update staging cache"; then
            git push -f origin staging-cache
          else
            echo "Staging cache unchanged"
          fi

  recover-daily:
    needs: collect
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Recover a missing daily edition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -m src.schedule_watchdog
          --repository "${GITHUB_REPOSITORY}"
          --workflow daily-summary.yml
          --ref main
          --timezone Asia/Shanghai
          --cutoff-hour 8
          --grace-minutes 30
          --trigger-source feed-collection
          --success-on-recovery
