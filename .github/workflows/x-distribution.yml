name: BMTNews X Distribution

# Posts today's top stories to X from a plan that is written before anything
# is sent (src/x_queue.py). Only runs when x_delivery.mode is "drip" and the
# credentials are configured; otherwise every run exits without posting.
#
# The daily edition dispatches this workflow as soon as it publishes, which
# sends the first story. Later runs only poll: a cheap stdlib gate reads
# the queue and the published edition state and exits in seconds unless a
# post is due, the edition changed, or a deadline passed. Each run sends at
# most one post, and an outcome that cannot be proven is never retried.

on:
  # GitHub's own schedules are unreliable on this repository (runs arrive
  # hours late or not at all). The Cloudflare dispatcher starts the Square
  # workflow every 5 minutes from 09:00 to 23:30 Asia/Shanghai, so each of
  # its completions doubles as this workflow's clock. Square must not list
  # this workflow among its own triggers, or the two would wake each other.
  workflow_run:
    workflows: ['BMTNews Binance Square Distribution']
    types: [completed]
    branches: [main]
  # Backup clock: every 20 minutes from 07:07 to 23:47 Asia/Shanghai (UTC).
  schedule:
    - cron: '7-59/20 23,0-15 * * *'
  workflow_dispatch:
    inputs:
      edition_date:
        description: Only today's edition is posted; another date is reported and ignored
        type: string
        required: false
        default: ''
      kickoff_only:
        description: Kept for compatibility; a kickoff is an ordinary run
        type: boolean
        required: false
        default: false

concurrency:
  group: bmtnews-x-distribution
  cancel-in-progress: false

permissions:
  contents: write  # Checkpoints the plan on the x-queue branch

jobs:
  post:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main # Never run another branch's code against the live account.

      - name: Restore published edition state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
          if git cat-file -e "origin/gh-pages:_data/bmtnews_state.json" 2>/dev/null; then
            mkdir -p docs/_data
            git show "origin/gh-pages:_data/bmtnews_state.json" > docs/_data/bmtnews_state.json
          fi

      - name: Restore isolated delivery queue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git init "$RUNNER_TEMP/x-state"
          git -C "$RUNNER_TEMP/x-state" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$RUNNER_TEMP/x-state" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/x-state" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Network/auth errors must not be read as an empty queue: that
          # would forget what was already sent and post it again.
          refs=$(git ls-remote --heads origin refs/heads/x-queue)
          if [ -n "$refs" ]; then
            git -C "$RUNNER_TEMP/x-state" fetch --depth=1 origin x-queue
            git -C "$RUNNER_TEMP/x-state" checkout -b x-queue FETCH_HEAD
            test -f "$RUNNER_TEMP/x-state/data/x-queue.json"
          else
            git -C "$RUNNER_TEMP/x-state" checkout --orphan x-queue
          fi

      - name: Queue gate (no dependencies)
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m src.x_queue \
            --queue "$RUNNER_TEMP/x-state/data/x-queue.json" \
            --feed-state docs/_data/bmtnews_state.json \
            --config data/config.github.json | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: steps.gate.outputs.work == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.gate.outputs.work == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - name: Install dependencies
        if: steps.gate.outputs.work == 'true'
        run: uv sync --frozen

      - name: Prepare GitHub Actions config
        if: steps.gate.outputs.work == 'true'
        run: cp data/config.github.json data/config.json

      - name: Plan and send with remote checkpoints
        if: steps.gate.outputs.work == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Needed when x_delivery.compose is "ai"; without them planning
          # falls back to the template post rather than failing.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          EDITION_DATE: ${{ inputs.edition_date }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--mode x-post --x-queue-dir "$RUNNER_TEMP/x-state")
          if [ -n "$EDITION_DATE" ]; then
            args+=(--edition-date "$EDITION_DATE")
          fi
          uv run bmtnews "${args[@]}"

      - name: Publish run report
        if: ${{ always() && steps.gate.outputs.work == 'true' }}
        shell: bash
        run: |
          if [ -f data/run-report.json ]; then
            python -m src.run_report --input data/run-report.json --output "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep machine-readable cost and health report
        if: ${{ always() && steps.gate.outputs.work == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: run-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/run-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Flag posts that need a person
        if: steps.gate.outputs.attention != '0'
        run: |
          echo "::error::The X queue has unknown, pending or failed posts. Check the account, then resolve them on the x-queue branch (project-docs/x-distribution.md)."
          exit 1
