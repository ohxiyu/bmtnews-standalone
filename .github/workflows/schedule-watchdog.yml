name: BMTNews Schedule Watchdog

on:
  schedule:
    # UTC schedules: 07:43, then hourly 08:17-15:17 in Asia/Shanghai.
    # Repeated checks recover when either scheduler drops or delays one event.
    - cron: '43 23 * * *'
    - cron: '17 0-7 * * *'
  workflow_dispatch:

concurrency:
  group: bmtnews-schedule-watchdog
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check daily edition heartbeat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_CHECK_TOKEN: ${{ secrets.RECOVERY_CHECK_TOKEN }}
        run: >-
          python -m src.schedule_watchdog
          --coordinator
          --repository "${GITHUB_REPOSITORY}"
          --workflow daily-summary.yml
          --ref main
          --timezone Asia/Shanghai
          --cutoff-hour 7
          --grace-minutes 43
